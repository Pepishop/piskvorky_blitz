<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Piskvorky s časovým limitem</title>
    <style>
        body {
            text-align: center;
            font-family: sans-serif;
        }
        .casova-lajna {
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        table {
            margin: 0 auto;
            border-collapse: collapse;
        }
        td {
            width: 30px;
            height: 30px;
            border: 1px solid black;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<h1>Piškvorky 10x10</h1>
<div class="casova-lajna">
    Čas X: <span id="casX">60</span>s | Čas O: <span id="casO">60</span>
</div>
<h3 id="info">Na tahu je: X</h3>

<table id="hraciPlocha"></table>

<script src="script.js"></script>
</body>
</html>
